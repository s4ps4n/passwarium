name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Client tests (generator, crypto, merge, CSV, QR)
        run: node test/app.test.mjs

      - name: Server tests (vault key, rate limit, headers, static)
        run: python3 test/server.test.py
