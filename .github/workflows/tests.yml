name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # клиентские тесты гоняют настоящий Argon2id — около пяти минут
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unlock regression (Authorization header on a new device)
        run: node test/unlock-header.test.mjs

      - name: Client tests (generator, crypto, merge, CSV, QR)
        run: node test/app.test.mjs

      - name: Server tests (vault key, rate limit, headers, static)
        run: python3 test/server.test.py
